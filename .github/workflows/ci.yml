name: CI

on:
  push:
    branches: [main, coa]
  pull_request:
    branches: [main, coa]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, MySQL 5.7)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    services:
      # 5.7 on purpose: it is what production runs. Testing on 8.x would hide
      # the index-length and strict-mode differences that actually bite there.
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none
          ini-values: memory_limit=512M

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env || touch .env
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"
          exit 1

      - name: Run the test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: restaurant_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  migrations:
    name: Migrations round-trip
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_migrate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: |
          cp .env.example .env || touch .env
          php artisan key:generate --force

      - name: Migrate up, roll back Phase 5, migrate up again
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: restaurant_migrate
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=10 --force
          php artisan migrate --force
          php artisan migrate:status | tail -12

      - name: Seed the production-safe seeders
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: restaurant_migrate
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan db:seed --class=StateSeeder --force
          php artisan db:seed --class=ChartOfAccountsSeeder --force
          php artisan db:seed --class=VendorsSeeder --force
          php artisan db:seed --class=InventoryCategoriesSeeder --force
          php artisan db:seed --class=FannsPhillyOrderGuideSeeder --force
          php artisan db:seed --class=VendorsSeeder --force
          php artisan db:seed --class=InventoryCategoriesSeeder --force
          php artisan db:seed --class=FannsPhillyOrderGuideSeeder --force
          echo 'Seeders are idempotent: the second pass must change nothing.'
